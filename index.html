<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Invasion</title>
<style>html,body{margin:0;height:100%;background:#05000f;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#05000f}</style>
</head><body>
<!-- The game lives in this frame. Fullscreen is applied to THIS page, so going back to the main menu (which reloads the frame) never leaves fullscreen. -->
<iframe id="g" allow="fullscreen; autoplay; gamepad; gyroscope; accelerometer; clipboard-write" allowfullscreen></iframe>
<script>
(function(){
  var f=document.getElementById('g');
  f.src='game.html'+location.search+location.hash;   // keeps ?room=CODE invite links working
  function focusGame(){try{f.contentWindow.focus();}catch(e){}}
  f.addEventListener('load',focusGame);window.addEventListener('focus',focusGame);
  document.addEventListener('fullscreenchange',focusGame);document.addEventListener('webkitfullscreenchange',focusGame);
})();
</script></body></html>
